name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so git-stats / git-commits scripts work correctly.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: ./app
        run: bun install --frozen-lockfile

      - name: Regenerate git-stats.json
        run: bun scripts/generate-git-stats.js

      - name: Regenerate git-commits.json
        run: bun scripts/generate-git-commits.js

      - name: Run ESLint
        working-directory: ./app
        run: bun run lint

      - name: Type check
        working-directory: ./app
        run: bunx tsc --noEmit

      - name: Build project
        working-directory: ./app
        env:
          NODE_ENV: "production"
        run: bun run build

      - name: Check build output
        working-directory: ./app
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          echo "Build successful!"
