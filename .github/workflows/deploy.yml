name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history needed so generate-git-commits.js can read all 20 commits.
          # Without this, GitHub Actions only clones the latest commit (depth=1).
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: ./app
        run: bun install --frozen-lockfile

      - name: Regenerate git-stats.json
        run: bun scripts/generate-git-stats.js

      - name: Regenerate git-commits.json
        run: bun scripts/generate-git-commits.js

      - name: Regenerate git-meta.json
        run: bun scripts/generate-git-meta.js

      - name: Regenerate activity-feed.json
        run: bun scripts/generate-activity-feed.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        working-directory: ./app
        env:
          BASE_URL: "https://utkarsh5026.github.io"
          NODE_ENV: "production"
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./app/dist
