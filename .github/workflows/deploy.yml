name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history needed so generate-git-commits.js can read all 20 commits.
          # Without this, GitHub Actions only clones the latest commit (depth=1).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "./app/package-lock.json"

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Regenerate git-stats.json
        run: node scripts/generate-git-stats.js

      - name: Regenerate git-commits.json
        run: node scripts/generate-git-commits.js

      - name: Build
        working-directory: ./app
        env:
          BASE_URL: "https://utkarsh5026.github.io"
          NODE_ENV: "production"
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./app/dist
