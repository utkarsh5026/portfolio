name: Deploy to Vercel

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "vercel-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: ./app
        run: bun install --frozen-lockfile

      - name: Generate git-stats.json
        run: bun scripts/generate-git-stats.js

      - name: Generate git-commits.json
        run: bun scripts/generate-git-commits.js

      - name: Generate git-meta.json
        run: bun scripts/generate-git-meta.js

      - name: Generate activity-feed.json
        run: bun scripts/generate-activity-feed.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        working-directory: ./app
        run: bun run build
        env:
          NODE_ENV: production

      - name: Deploy to Vercel (Production)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          bunx vercel deploy ./app/dist --prebuilt \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --prod
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (Preview)
        if: github.event_name == 'pull_request'
        run: |
          bunx vercel deploy ./app/dist --prebuilt \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
